name: Diagnostica temporanea
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_SSH_HOST }}
          username: ${{ secrets.OVH_SSH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            cd ~/www
            echo "=== ultimi errori ==="
            grep -oE "ERROR: [^{]{0,200}" storage/logs/laravel.log | tail -5
