name: Deploy in produzione (OVH)

# Parte ad ogni push sul branch di produzione.
on:
  push:
    branches: [production]
  workflow_dispatch: {}   # consente anche l'avvio manuale dalla tab Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false   # non interrompere un deploy a metà

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_SSH_HOST }}
          username: ${{ secrets.OVH_SSH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            cd ~/www
            chmod +x deploy.sh
            ./deploy.sh
