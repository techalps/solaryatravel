name: Pulizia riserve orfane (una volta)
on: { workflow_dispatch: {} }
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_SSH_HOST }}
          username: ${{ secrets.OVH_SSH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            cd ~/www
            echo "### PRIMA (elenco) ###"
            /usr/local/php8.4/bin/php artisan blocks:clean-orphans
            echo "### RILASCIO ###"
            /usr/local/php8.4/bin/php artisan blocks:clean-orphans --fix
            echo "### DOPO (verifica) ###"
            /usr/local/php8.4/bin/php artisan blocks:clean-orphans
